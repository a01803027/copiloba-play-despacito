; PlatformIO configuration for CV-DAW Wearable LED Shirt (30-Pin ESP32 DevKit)
; You can also open `playera_led_esp32/playera_led_esp32.ino` directly in Arduino IDE!

[platformio]
src_dir = playera_led_esp32

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    fastled/FastLED@^3.7.0
